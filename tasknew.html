<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        display: grid;
        grid-column: 1fr 1fr 1fr;
        column-gap: 10px;
        width: auto;
        height: 500px;
      }

      p{
        margin-top: 0%;
      }

      .one {
        background-color: brown;
        grid-column: 1/4;
        /* grid-row:1; */
      }
      .two {
        background-color: orange;
        grid-column: 1/3;
        grid-row: 2/4;
      }
      .three {
        background-color: blue;
        grid-column: 3/4;
        grid-row: 2;
      }
      .four {
        background-color: yellow;
      }
      .five {
        background-color: rgb(175, 92, 175);
      }
      .six {
        background-color: lightgreen;
      }
      .seven {
        background-color: salmon;
      }
      .eight {
        background-color: rgb(121, 239, 200);
      }
      .nine {
        background-color: red;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <p class="one">1</p>

      <p class="two">2</p>

      <p class="three">3</p>

      <p class="four">4</p>

      <p class="five">5</p>

      <p class="six">6</p>

      <p class="seven">7</p>

      <p class="eight">8</p>

      <p class="nine">9</p>
    </div>
  </body>
</html>
