<!DOCTYPE html>
<html>
  <head>
    <title>Hello, World!</title>
  </head>
  <body>

    <p1 id="id">This is visible</p1>
    <button class="btn" onclick="hideIT()">Hide i</button>

    <script>
      const x=document.getElementById('id');
      function hideIT(){
        if(x.style.visibility==='hidden'){
          x.style.visibility='visible';
        }
        else{
          x.style.visibility='hidden'
        }
      }
    </script>

      
  </body>
</html>
